version: "3.8"

services:
  emby-notifier-bot:
    build:
      context: .
      dockerfile: dockerfile
    image: emby-notifier-bot-wecom:1.0.2
    container_name: emby-notifier-bot-wecom
    environment:
      TZ: "Asia/Shanghai"
      WEBHOOK_PORT: "53211"
      EMBY_MONITOR_EVENTS: "playback.start,playback.stop,playback.pause,user.authenticated,user.logout,library.new,library.deleted,metadata.update"
      ENABLE_COVERS: "true"
      # Emby 服务器连接（用于封面图片获取）
      EMBY_SERVER_URL: "http://your_emby_server:8096"
      EMBY_API_KEY: "your_api_key_here"
      OVERVIEW_MAX_LENGTH: "300"

      # 飞书群自定义机器人（推荐）：仅需 FEISHU_WEBHOOK_URL 即可启用。
      # 支持多个 webhook（逗号分隔），分别推送到不同群。
      FEISHU_WEBHOOK_URL: ""
      # 飞书 API 代理（可选）。未设置时直接访问飞书服务器。
      FEISHU_PROXY: ""

      # 企业微信应用消息：三项必填；未指定 WECOM_TO_USER 时推送给 @all。
      WECOM_CORP_ID: "your_corp_id"
      WECOM_AGENT_ID: "应用AgentId"
      WECOM_CORP_SECRET: "your_app_secret"
      WECOM_TO_USER: "@all"
      # 企业微信 API 反向代理地址（可选）。设置后 bot 通过 HTTP 中转推送消息，
      # 适用于自建 Caddy/Nginx 反向代理不支持 CONNECT 隧道的场景。
      # 示例：http://你的代理IP:端口
      WECOM_API_URL: ""
      # 企业微信 API 代理（可选）。未设置时会使用 HTTPS_PROXY / HTTP_PROXY。
      WECOM_PROXY: ""
      # 仅在需要把 /wecom-callback 配置为企业微信回调地址时填写。
      WECOM_TOKEN: ""
      WECOM_ENCODING_AES_KEY: ""

      # 可选：保留原 Telegram 通道，与其他通道同时发送。
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    ports:
      - "53211:53211"
    network_mode: bridge
    restart: unless-stopped
